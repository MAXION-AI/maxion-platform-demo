name: Program gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: program-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prove checked-out revision identity
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Load explicit candidate phase
        run: |
          phase="$(python3 -c 'import json; print(json.load(open("docs/operations/program-phase-ledger.json", encoding="utf-8"))["candidatePhase"])')"
          test "$phase" -ge 0
          echo "MAXION_PROGRAM_PHASE=$phase" >> "$GITHUB_ENV"
      - name: Activate pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned browser runtimes
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Program and source gates
        run: pnpm check:program
      - name: Production build and bundle metadata gate
        run: |
          MAXION_BUILD_REVISION="$(git rev-parse HEAD)" pnpm build
          pnpm check:bundle --metadata-out test-results/bundle-budget.json
      - name: Unit tests
        run: pnpm test
      - name: Browser acceptance
        run: pnpm test:e2e
      - name: Dependency audit
        run: pnpm audit --audit-level high
      # Run the complete qualification first, then make merge-readiness fail closed unless
      # the exact PR head is a distinct evidence commit over its declared candidate C.
      - name: Require evidence-only PR head for merge readiness
        if: github.event_name == 'pull_request'
        run: |
          candidate="$(git show -s --format='%(trailers:key=Phase-Candidate,valueonly)' HEAD | tr -d '[:space:]')"
          test "${#candidate}" -eq 40
          test "$candidate" != "$(git rev-parse HEAD)"
          python3 scripts/check_phase_acceptance.py \
            --candidate "$candidate" \
            --evidence "$(git rev-parse HEAD)" \
            --phase "$MAXION_PROGRAM_PHASE"
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: program-gate-evidence-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
