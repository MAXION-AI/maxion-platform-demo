name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build GitHub Pages artifact
        env:
          GITHUB_PAGES: "true"
        run: pnpm build

      # GitHub Pages serves HTML and assets with a short CDN cache. Retaining the
      # recent hashed assets means an HTML document cached just before a deploy
      # can still load while the CDN revalidates it against the new release.
      - name: Retain recent Pages assets during CDN propagation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive_dir="$(mktemp -d)"

          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/runs?status=success&per_page=10" \
            --jq '.workflow_runs[].id' > "$archive_dir/run-ids"

          while read -r run_id; do
            [ -n "$run_id" ] || continue
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | head -n 1 || true)"
            [ -n "$artifact_id" ] || continue

            artifact_dir="$archive_dir/$artifact_id"
            mkdir -p "$artifact_dir"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$artifact_dir/pages.zip" || continue
            unzip -p "$artifact_dir/pages.zip" artifact.tar > "$artifact_dir/artifact.tar" || continue
            tar -xf "$artifact_dir/artifact.tar" -C "$artifact_dir" || continue
            [ -d "$artifact_dir/assets" ] || continue
            find "$artifact_dir/assets" -maxdepth 1 -type f -exec cp -n {} dist/assets/ \;
          done < "$archive_dir/run-ids"

      - name: Add single-page app fallback
        run: cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
